  urgent:
    link: "Quand consulter en urgence"
    title: "Quand consulter en urgence"
    intro: "Un mal de tête n'est presque jamais dangereux, mais certains signes demandent un avis médical rapide. Cette page est un repère, pas un diagnostic : en cas de doute, appelez."
    emergency_title: "Appelez le 112 ou allez aux urgences si"
    emergency:
      - "le mal de tête est soudain et violent, au maximum en moins d'une minute (« en coup de tonnerre »), ou c'est le pire de votre vie"
      - "il s'accompagne d'une faiblesse ou d'un engourdissement d'un côté du corps, d'un visage qui se déforme, de difficultés à parler, d'une vue double ou d'une perte de vision, d'une confusion, d'une perte de connaissance ou de convulsions"
      - "il s'accompagne de fièvre avec une nuque raide, ou d'une éruption cutanée"
      - "il survient après un coup à la tête"
    soon_title: "Consultez rapidement un médecin si"
    soon:
      - "c'est un mal de tête nouveau après 50 ans, ou différent de vos crises habituelles"
      - "les maux de tête s'aggravent peu à peu sur des jours ou des semaines"
      - "la douleur est déclenchée par la toux, un effort ou un éternuement, ou change avec la position (couché ou debout)"
      - "une aura est nouvelle, dure plus d'une heure, ou s'accompagne d'une faiblesse"
      - "vous êtes enceinte ou venez d'accoucher"
      - "vous avez un cancer, une maladie ou un traitement qui affaiblit les défenses immunitaires"
      - "l'œil est rouge et douloureux avec une vue trouble"
      - "une crise dure plus de 72 heures"
    source: "Repères d'après la liste des signes d'alerte des céphalées secondaires (Do et coll., Neurology 2019) et les recommandations de l'International Headache Society. Ils ne remplacent pas l'avis d'un médecin."

  info:
    label: "Explication"
    more: "Comprendre mes chiffres"

  numbers:
    title: "Comprendre mes chiffres"
    sections:
      days:
        title: "Des jours, pas des épisodes"
        body: "Une journée compte comme jour de migraine ou de mal de tête si au moins un épisode de ce type a eu lieu, même s'il y en a eu plusieurs. C'est l'unité que lisent les neurologues. Une journée est « à 4/10 ou plus » quand son épisode le plus fort atteint 4 : il n'existe pas de seuil officiel sur l'échelle de 0 à 10, 4 est la convention usuelle pour « modéré »."
        source: "Classification internationale des céphalées (ICHD-3)."
      limits:
        title: "Les limites de traitement"
        body: "Trop de jours de traitement peut entretenir les maux de tête. Trois repères, du plus prudent au plus sérieux. Les limites conseillées : moins de 10 jours par mois et pas plus de 3 par semaine pour les antidouleurs simples et les AINS ; moins de 8 par mois et pas plus de 2 par semaine pour les triptans et les antidouleurs associés. Les seuils de diagnostic : 10 jours par mois pour les triptans et les associés, 15 pour les antidouleurs simples, 10 en mélangeant plusieurs types. Enfin ces seuils atteints 3 mois de suite, qui est le critère de la céphalée par surconsommation. Les semaines vont du lundi au dimanche. C'est un rappel pour en parler à votre médecin, jamais un diagnostic."
        source: "Recommandations de l'International Headache Society 2024 ; ICHD-3, critère 8.2 ; jury de consensus INAMI 2023."
      acute:
        title: "Le bilan d'un traitement de crise"
        body: "Il repose sur l'effet que vous notez après chaque crise. Un traitement qui n'a rien fait sur 2 des 3 dernières crises notées est considéré comme inefficace. Avant d'en changer, parlez-en à votre médecin : la dose, le moment de la prise ou la forme peuvent compter. Prendre le traitement tôt, quand la douleur est encore légère, est ce qui marche le mieux."
        source: "Jury de consensus INAMI 2023 ; recommandations IHS 2024."
      preventive:
        title: "L'avant et après d'un traitement de fond"
        body: "On compare les jours de douleur par mois pendant les 90 jours avant le début à ceux des 90 derniers jours du traitement. Une baisse de moitié ou plus est le repère habituel d'un traitement efficace, jugé après 3 mois à la bonne dose. En migraine chronique, une baisse de 30 % déjà est acceptée. La comparaison n'est faite que si le traitement a duré 90 jours et si votre journal couvre les 90 jours précédents."
        source: "Recommandations IHS 2024 ; European Headache Federation."
      chronic:
        title: "Le profil de migraine chronique"
        body: "Il s'agit d'au moins 15 jours de maux de tête par mois pendant plus de 3 mois, dont au moins 8 avec les caractères d'une migraine. La cause la plus fréquente est la surconsommation de traitements de crise. Seul un médecin pose le diagnostic."
        source: "ICHD-3, critère 1.3."
      menstrual:
        title: "Le lien avec les règles"
        body: "Une crise est dite menstruelle quand elle survient de 2 jours avant à 3 jours après le premier jour des règles, lors d'au moins 2 cycles sur 3. Elle est « pure » si elle n'a lieu qu'à ce moment du cycle, ce qui est rare. Il faut 3 cycles notés pour en parler."
        source: "ICHD-3, annexe A1.1.1."
      factors:
        title: "Les facteurs du quotidien"
        body: "Le bilan quotidien compare la part des jours avec douleur après un jour avec un facteur (mauvaise nuit, stress élevé, baisse du stress, repas sauté, beaucoup de caféine) à la part après les autres jours, le jour même, le lendemain et 2 jours après. Rien n'est affiché avant 30 jours de bilan, et un facteur n'est signalé qu'à partir de 8 jours concernés et de 15 points d'écart. C'est un lien dans votre journal, pas une preuve de cause. Les signes avant-coureurs d'une crise (fatigue, envie de sucré, nuque raide) ressemblent à des déclencheurs : ne les notez pas dans le bilan."
        source: "Études de journaux de migraineux : Peris 2017 ; Lipton 2014 ; Bertisch 2020 ; Mostofsky 2019."

