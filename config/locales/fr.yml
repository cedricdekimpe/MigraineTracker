  urgent:
    link: "Quand consulter en urgence"
    title: "Quand consulter en urgence"
    intro: "Un mal de tête n'est presque jamais dangereux, mais certains signes demandent un avis médical rapide. Cette page est un repère, pas un diagnostic : en cas de doute, appelez."
    emergency_title: "Appelez le 112 ou allez aux urgences si"
    emergency:
      - "le mal de tête est soudain et violent, au maximum en moins d'une minute (« en coup de tonnerre »), ou c'est le pire de votre vie"
      - "il s'accompagne d'une faiblesse ou d'un engourdissement d'un côté du corps, d'un visage qui se déforme, de difficultés à parler, d'une vue double ou d'une perte de vision, d'une confusion, d'une perte de connaissance ou de convulsions"
      - "il s'accompagne de fièvre avec une nuque raide, ou d'une éruption cutanée"
      - "il survient après un coup à la tête"
    soon_title: "Consultez rapidement un médecin si"
    soon:
      - "c'est un mal de tête nouveau après 50 ans, ou différent de vos crises habituelles"
      - "les maux de tête s'aggravent peu à peu sur des jours ou des semaines"
      - "la douleur est déclenchée par la toux, un effort ou un éternuement, ou change avec la position (couché ou debout)"
      - "une aura est nouvelle, dure plus d'une heure, ou s'accompagne d'une faiblesse"
      - "vous êtes enceinte ou venez d'accoucher"
      - "vous avez un cancer, une maladie ou un traitement qui affaiblit les défenses immunitaires"
      - "l'œil est rouge et douloureux avec une vue trouble"
      - "une crise dure plus de 72 heures"
    source: "Repères d'après la liste des signes d'alerte des céphalées secondaires (Do et coll., Neurology 2019) et les recommandations de l'International Headache Society. Ils ne remplacent pas l'avis d'un médecin."

  info:
    label: "Explication"
    more: "Comprendre mes chiffres"

  numbers:
    title: "Comprendre mes chiffres"
    sections:
      days:
        title: "Des jours, pas des épisodes"
        body: "Une journée compte comme jour de migraine ou de mal de tête si au moins un épisode de ce type a eu lieu, même s'il y en a eu plusieurs. C'est l'unité que lisent les neurologues. Une journée est « à 4/10 ou plus » quand son épisode le plus fort atteint 4 : il n'existe pas de seuil officiel sur l'échelle de 0 à 10, 4 est la convention usuelle pour « modéré »."
        source: "Classification internationale des céphalées (ICHD-3)."
      limits:
        title: "Les limites de traitement"
        body: "Trop de jours de traitement peut entretenir les maux de tête. Trois repères, du plus prudent au plus sérieux. Les limites conseillées : moins de 10 jours par mois et pas plus de 3 par semaine pour les antidouleurs simples et les AINS ; moins de 8 par mois et pas plus de 2 par semaine pour les triptans et les antidouleurs associés. Les seuils de diagnostic : 10 jours par mois pour les triptans et les associés, 15 pour les antidouleurs simples, 10 en mélangeant plusieurs types. Enfin ces seuils atteints 3 mois de suite, qui est le critère de la céphalée par surconsommation. Les semaines vont du lundi au dimanche. C'est un rappel pour en parler à votre médecin, jamais un diagnostic."
        source: "Recommandations de l'International Headache Society 2024 ; ICHD-3, critère 8.2 ; jury de consensus INAMI 2023."
      acute:
        title: "Le bilan d'un traitement de crise"
        body: "Il repose sur l'effet que vous notez après chaque crise. Un traitement qui n'a rien fait sur 2 des 3 dernières crises notées est considéré comme inefficace. Avant d'en changer, parlez-en à votre médecin : la dose, le moment de la prise ou la forme peuvent compter. Prendre le traitement tôt, quand la douleur est encore légère, est ce qui marche le mieux."
        source: "Jury de consensus INAMI 2023 ; recommandations IHS 2024."
      preventive:
        title: "L'avant et après d'un traitement de fond"
        body: "On compare les jours de douleur par mois pendant les 90 jours avant le début à ceux des 90 derniers jours du traitement. Une baisse de moitié ou plus est le repère habituel d'un traitement efficace, jugé après 3 mois à la bonne dose. En migraine chronique, une baisse de 30 % déjà est acceptée. La comparaison n'est faite que si le traitement a duré 90 jours et si votre journal couvre les 90 jours précédents."
        source: "Recommandations IHS 2024 ; European Headache Federation."
      chronic:
        title: "Le profil de migraine chronique"
        body: "Il s'agit d'au moins 15 jours de maux de tête par mois pendant plus de 3 mois, dont au moins 8 avec les caractères d'une migraine. La cause la plus fréquente est la surconsommation de traitements de crise. Seul un médecin pose le diagnostic."
        source: "ICHD-3, critère 1.3."
      menstrual:
        title: "Le lien avec les règles"
        body: "Une crise est dite menstruelle quand elle survient de 2 jours avant à 3 jours après le premier jour des règles, lors d'au moins 2 cycles sur 3. Elle est « pure » si elle n'a lieu qu'à ce moment du cycle, ce qui est rare. Il faut 3 cycles notés pour en parler."
        source: "ICHD-3, annexe A1.1.1."
      factors:
        title: "Les facteurs du quotidien"
        body: "Le bilan quotidien compare la part des jours avec douleur après un jour avec un facteur (mauvaise nuit, stress élevé, baisse du stress, repas sauté, beaucoup de caféine) à la part après les autres jours, le jour même, le lendemain et 2 jours après. Rien n'est affiché avant 30 jours de bilan, et un facteur n'est signalé qu'à partir de 8 jours concernés et de 15 points d'écart. C'est un lien dans votre journal, pas une preuve de cause. Les signes avant-coureurs d'une crise (fatigue, envie de sucré, nuque raide) ressemblent à des déclencheurs : ne les notez pas dans le bilan."
        source: "Études de journaux de migraineux : Peris 2017 ; Lipton 2014 ; Bertisch 2020 ; Mostofsky 2019."

  privacy:
    title: "Politique de confidentialité"
    description: "Ce que Migraine Tracker conserve, pourquoi, combien de temps, avec qui, et vos droits."
    updated: "Dernière mise à jour : 23 octobre 2026"
    intro: "Migraine Tracker conserve uniquement ce que vous y notez. Il n'y a ni publicité, ni pistage, ni script, police ou outil de mesure chargé depuis un autre site."
    sections:
      data:
        title: "Les données conservées"
        points:
          - "Votre compte : adresse e-mail, mot de passe haché (jamais lisible), date et version de votre consentement."
          - "Votre journal : pour chaque épisode, la date, l'heure de début et la durée si vous les notez, le type de douleur, l'aura, l'intensité, les médicaments pris (dose, heure, effet), les déclencheurs cochés et vos notes."
          - "Vos médicaments (nom, type, dose habituelle) et les périodes de vos traitements de fond (début, fin, dose, raison de l'arrêt)."
          - "Vos bilans du jour (sommeil, stress, repas sauté, caféine) et, si vous activez le suivi du cycle, vos jours de règles."
          - "Sans compte : une crise notée depuis la page d'accueil reste dans un cookie chiffré de votre navigateur. Elle n'arrive sur le serveur que si vous créez un compte ou vous connectez, et disparaît si vous choisissez « Ne pas le garder » ou fermez le navigateur."
      technical:
        title: "Cookies et données techniques"
        points:
          - "Un cookie de session, indispensable pour rester connecté ; si vous cochez « Se souvenir de moi », un second cookie qui dure deux semaines. Aucun cookie de mesure ou de publicité."
          - "Votre choix de thème (Auto, Papier, Nuit) reste dans votre navigateur."
          - "Pour bloquer les attaques sur les mots de passe, l'adresse IP et l'adresse e-mail des tentatives de connexion sont comptées pendant une heure au plus."
          - "Les journaux techniques du serveur notent les pages demandées et l'adresse IP ; vos données de santé en sont filtrées."
      purpose:
        title: "Pourquoi et sur quelle base"
        points:
          - "Tenir votre journal, calculer vos statistiques et produire le rapport PDF pour votre médecin."
          - "Vous permettre d'exporter et d'importer vos données."
          - "Vous écrire uniquement pour réinitialiser votre mot de passe : pas de lettre d'information, pas de publicité."
          - "Base légale : votre consentement explicite à la création du compte, nécessaire pour des données de santé (RGPD, article 9, paragraphe 2, point a). Vous pouvez le retirer à tout moment en supprimant votre compte."
      retention:
        title: "Durée de conservation"
        points:
          - "Vos données restent tant que votre compte existe ; le supprimer les efface immédiatement de la base."
          - "Les fichiers d'export vous sont envoyés directement et ne sont pas gardés sur le serveur."
          - "Les compteurs anti-abus disparaissent au bout d'une heure au plus."
      sharing:
        title: "Partage et sécurité"
        points:
          - "Vos données ne sont ni vendues, ni partagées, ni utilisées pour la publicité."
          - "Le service tourne sur un serveur loué chez Hetzner Online, dans l'Union européenne. L'hébergeur stocke les données pour notre compte ; aucun autre service n'y a accès."
          - "Les données circulent chiffrées (HTTPS). Dans la base, elles sont protégées par l'accès au serveur ; elles ne sont pas encore chiffrées une à une."
      rights:
        title: "Vos droits"
        points:
          - "Accès et portabilité : Compte › Gestion des données › « Exporter toutes les données », un fichier JSON complet, à tout moment."
          - "Rectification : modifiez chaque épisode, médicament, période ou bilan dans l'application."
          - "Effacement et retrait du consentement : Compte › Gestion des données › « Supprimer mon compte » efface tout, définitivement."
          - "Pour toute autre demande (opposition, limitation, question) : écrivez à l'adresse ci-dessous."
          - "Réclamation : l'Autorité de protection des données en Belgique (autoriteprotectiondonnees.be), ou l'autorité de votre pays."
    contact_title: "Contact et responsable du traitement"
    contact_email_label: "E-mail"
    contact_email: "[privacy@migraine-tracker.eu]"
    contact_address_label: "Responsable"
    contact_address: "[Nom, ville, pays]"

  faq:
    title: "Questions fréquentes"
    subtitle: "Utiliser Migraine Tracker, gérer vos données, protéger votre vie privée."
    disclaimer_title: "En cas de doute"
    disclaimer_text: "Un mal de tête inhabituel peut demander un avis rapide."
    sections:
      usage: "Utiliser l'application"
      account: "Votre compte et vos données"
      privacy: "Confidentialité"
    items:
      track_crisis:
        question: "Comment noter une crise ?"
        answer: "Touchez « J'ai mal » (en bas sur téléphone, en haut sur ordinateur), choisissez le type puis l'intensité : la crise démarre. Ajoutez les médicaments au fur et à mesure, touchez « C'est passé », puis dites comment ils ont agi. Une crise passée se note avec « Épisode passé » ou en touchant le jour dans le journal."
      guest:
        question: "Puis-je noter une crise sans compte ?"
        answer: "Oui, depuis la page d'accueil. Elle reste dans votre navigateur ; créez ensuite un compte ou connectez-vous pour la garder."
      daily_check:
        question: "À quoi sert le bilan du jour ?"
        answer: "Trois questions (sommeil, stress, repas et caféine), même les jours sans crise, et vos règles si vous les suivez. Après 30 jours, les statistiques comparent les jours qui suivent un facteur aux autres jours : c'est un lien dans votre journal, pas une preuve de cause."
      medications:
        question: "Comment gérer mes médicaments ?"
        answer: "Compte › Médicaments. Ajoutez un médicament, ou choisissez-le parmi les médicaments courants, avec son type : il décide comment ses jours sont comptés. « Modifier » change le nom, le type ou la dose, ou le retire (il est archivé s'il a déjà servi). Pour un traitement de fond, notez ses périodes : début, fin et raison de l'arrêt."
      statistics:
        question: "Que montrent les statistiques ?"
        answer: "Les jours de douleur et de traitement du mois, les limites de traitement à surveiller, l'effet de chaque traitement de crise, l'avant et après de vos traitements de fond, le lien avec les règles si vous les suivez, et ce qui précède vos crises d'après vos bilans."
      report:
        question: "Comment préparer ma consultation ?"
        answer: "Le lien « Rapport médecin (PDF) », dans le journal ou les statistiques, produit l'année : une page de synthèse, une page d'indicateurs et vos feuilles de calendrier, comme celles de votre neurologue."
      export:
        question: "Comment exporter mes données ?"
        answer: "Compte › Gestion des données › « Exporter toutes les données » télécharge un fichier JSON avec tout votre journal : épisodes, médicaments et périodes de traitement, déclencheurs, jours de règles et bilans du jour."
      import:
        question: "Puis-je importer une sauvegarde ?"
        answer: "Oui, au même endroit, avec « Importer depuis un fichier ». Ce qui est déjà présent (même épisode, même jour de règles, même bilan) est ignoré. Si le fichier contient une erreur, rien n'est importé."
      delete:
        question: "Comment supprimer mon compte ?"
        answer: "Compte › Gestion des données › « Supprimer mon compte ». Tapez la phrase de confirmation et votre mot de passe. Tout est effacé définitivement : exportez d'abord si vous voulez garder une copie."
      storage:
        question: "Où sont mes données et qui peut les voir ?"
        answer: "Sur un serveur dans l'Union européenne, visibles par vous seul depuis votre compte. Elles circulent chiffrées (HTTPS) et votre mot de passe est haché. Aucun script, police ou outil de mesure d'un autre site n'est chargé."
      sharing:
        question: "Partagez-vous mes données ?"
        answer: "Non. Elles ne sont ni vendues, ni partagées, ni utilisées pour la publicité. Seul l'hébergeur du serveur les stocke pour notre compte."
      rights:
        question: "Quels sont mes droits ?"
        answer: "Exporter vos données, les corriger dans l'application et supprimer votre compte, à tout moment et sans nous écrire. Le détail et le contact sont dans la politique de confidentialité."
    links:
      data: "Gestion des données"
      numbers: "Comprendre mes chiffres"
      privacy: "Politique de confidentialité"
      urgent: "Quand consulter en urgence"
    contact_title: "Encore une question ?"
    contact_text: "Écrivez à l'adresse indiquée dans la politique de confidentialité."

