  info:
    label: "Explanation"
    more: "Understand my figures"

  numbers:
    title: "Understand my figures"
    sections:
      days:
        title: "Days, not episodes"
        body: "A day counts as a migraine or headache day if at least one episode of that kind happened, even if there were several. It is the unit neurologists read. A day is \"4/10 or more\" when its strongest episode reaches 4: there is no official cut-off on the 0 to 10 scale, 4 is the usual convention for \"moderate\"."
        source: "International Classification of Headache Disorders (ICHD-3)."
      limits:
        title: "Treatment limits"
        body: "Too many treatment days can keep headaches going. Three reference points, from the most cautious to the most serious. The advised limits: under 10 days a month and no more than 3 a week for simple painkillers and NSAIDs; under 8 a month and no more than 2 a week for triptans and combined painkillers. The diagnostic thresholds: 10 days a month for triptans and combined ones, 15 for simple painkillers, 10 when several kinds are mixed. Finally those thresholds reached 3 months in a row, which is the criterion for medication-overuse headache. Weeks run from Monday to Sunday. It is a reminder to talk to your doctor, never a diagnosis."
        source: "International Headache Society recommendations 2024; ICHD-3 criterion 8.2; Belgian INAMI consensus jury 2023."
      nausea:
        title: "Nausea"
        body: "Nausea or vomiting is one of the signs that define a migraine. It also matters for treatment: when the stomach is slow, tablets work less well, and a doctor may suggest an anti-nausea drug or another form (nasal spray, injection). The figure counts only the attacks where you answered, so it can be off if you skip the question on the worst days."
        source: "ICHD-3 criterion 1.1; American Migraine Prevalence and Prevention study; IHS recommendations 2024."
      acute:
        title: "The verdict on an acute treatment"
        body: "It rests on the effect you note after each attack. A treatment that did nothing on 2 of the last 3 rated attacks is considered ineffective. Before changing, talk to your doctor: the dose, the timing or the form may matter. Taking the treatment early, while the pain is still mild, works best."
        source: "Belgian INAMI consensus jury 2023; IHS recommendations 2024."
      preventive:
        title: "Before and after a preventive treatment"
        body: "The pain days a month over the 90 days before the start are compared with those of the last 90 days on the treatment. A drop of half or more is the usual yardstick for an effective treatment, judged after 3 months at the right dose. In chronic migraine a 30% drop is already accepted. The comparison is only made if the treatment lasted 90 days and your journal covers the 90 days before."
        source: "IHS recommendations 2024; European Headache Federation."
      chronic:
        title: "The chronic migraine pattern"
        body: "At least 15 headache days a month for more than 3 months, at least 8 of them with the features of migraine. The most common cause is overuse of acute treatments. Only a doctor makes the diagnosis."
        source: "ICHD-3, criterion 1.3."
      menstrual:
        title: "The link with the period"
        body: "An attack is called menstrual when it occurs from 2 days before to 3 days after the first day of the period, in at least 2 of 3 cycles. It is \"pure\" if it only happens at that point of the cycle, which is rare. 3 recorded cycles are needed to speak of a link."
        source: "ICHD-3, appendix A1.1.1."
      factors:
        title: "Everyday factors"
        body: "Each day you answer a few questions: sleep, stress, meals, caffeine. The app then checks whether your attacks come back more often after certain days, for example a poor night. It waits for 30 check-ins, and only flags a factor that happened at least 8 times, with a clear difference. It is a link in your journal, not proof of a cause. Tiredness, sugar cravings or a stiff neck can announce an attack that is already on its way: do not note them here."
        source: "Diary studies of people with migraine: Peris 2017; Lipton 2014; Bertisch 2020; Mostofsky 2019."

  privacy:
    title: "Privacy policy"
    description: "What Migraine Tracker keeps, why, for how long, with whom, and your rights."
    updated: "Last updated: 24 October 2026"
    intro: "Migraine Tracker keeps only what you write in it. There is no advertising, no tracking, and no script, font or analytics tool loaded from another site."
    sections:
      data:
        title: "The data kept"
        points:
          - "Your account: email address, hashed password (never readable), date and version of your consent."
          - "Your journal: for each episode, the date, the start time and duration if you note them, the type of pain, the aura, the intensity, nausea, the medications taken (dose, time, effect), the triggers ticked and your notes."
          - "Your medications (name, type, usual dose) and the periods of your preventive treatments (start, end, dose, reason for stopping)."
          - "Your daily check-ins (sleep, stress, skipped meal, caffeine) and, if you turn on cycle tracking, your period days."
          - "Without an account: an attack noted from the home page stays in an encrypted cookie in your browser. It only reaches the server if you create an account or sign in, and disappears if you choose \"Don't keep it\" or close the browser."
      technical:
        title: "Cookies and technical data"
        points:
          - "A session cookie, needed to stay signed in; if you tick \"Remember me\" (ticked by default), a second cookie that lasts three months and is renewed each time you come back. No analytics or advertising cookie."
          - "Your theme choice (Auto, Paper, Night) stays in your browser."
          - "Installed on a phone or a computer, the app keeps its technical files (styles, icons) on the device, plus two public pages, \"No connection\" and \"When to seek urgent care\". Never a page of your journal."
          - "An attack noted without network stays in the device's browser until the network is back, then it is sent and erased from the device."
          - "To block attacks on passwords, the IP address and email address of sign-in attempts are counted for one hour at most."
          - "The server's technical logs record the pages requested and the IP address; your health data is filtered out of them."
      purpose:
        title: "Why, and on what basis"
        points:
          - "To keep your journal, compute your statistics and produce the PDF report for your doctor."
          - "To let you export and import your data."
          - "To email you only to reset your password: no newsletter, no advertising."
          - "Legal basis: your explicit consent when creating the account, required for health data (GDPR, article 9(2)(a)). You can withdraw it at any time by deleting your account."
      retention:
        title: "How long it is kept"
        points:
          - "Your data stays as long as your account exists; deleting it erases them from the database at once."
          - "Export files are sent straight to you and not kept on the server."
          - "Anti-abuse counters disappear after one hour at most."
      sharing:
        title: "Sharing and security"
        points:
          - "Your data is not sold, shared or used for advertising."
          - "The service runs on a server rented from Hetzner Online, in the European Union. The host stores the data on our behalf; no other service has access to it."
          - "Data travels encrypted (HTTPS). In the database it is protected by access to the server; it is not yet encrypted field by field."
      rights:
        title: "Your rights"
        points:
          - "Access and portability: Account › Data management › \"Export all data\", a complete JSON file, at any time."
          - "Rectification: edit any episode, medication, period or check-in in the app."
          - "Erasure and withdrawal of consent: Account › Data management › \"Delete my account\" erases everything, permanently."
          - "For any other request (objection, restriction, question): write to the address below."
          - "Complaint: the Data Protection Authority in Belgium (dataprotectionauthority.be), or the authority of your country."
    contact_title: "Contact and data controller"
    contact_email_label: "Email"
    contact_email: "[privacy@migraine-tracker.eu]"
    contact_address_label: "Controller"
    contact_address: "[Name, city, country]"

