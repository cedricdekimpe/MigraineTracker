      hint: "Taking acute treatment too often can keep headaches going. Three reference points, from the most cautious to the most serious: the advised limits (under 10 days a month and no more than 3 a week for painkillers and NSAIDs; under 8 a month and no more than 2 a week for triptans and combined painkillers), the diagnostic thresholds (10 days for triptans and combined ones, 15 for simple painkillers, 10 when mixed), then those thresholds 3 months in a row."
