  faq:
    title: "Frequently asked questions"
    subtitle: "Using Migraine Tracker, managing your data, protecting your privacy."
    disclaimer_title: "If in doubt"
    disclaimer_text: "An unusual headache may need quick medical advice."
    sections:
      usage: "Using the app"
      account: "Your account and your data"
      privacy: "Privacy"
    items:
      track_crisis:
        question: "How do I log an attack?"
        answer: "Tap \"I have a headache\" (at the bottom on a phone, at the top on a computer), pick the type, then the intensity: the attack starts. Add medications as you take them, tap \"It's over\", then say how they worked. A past attack is logged with \"Past episode\" or by tapping the day in the journal."
      guest:
        question: "Can I log an attack without an account?"
        answer: "Yes, from the home page. It stays in your browser; create an account or sign in afterwards to keep it."
      daily_check:
        question: "What is the daily check-in for?"
        answer: "Three questions (sleep, stress, meals and caffeine), even on days without an attack, and your period if you track it. After 30 days, the statistics compare the days that follow a factor with the other days: it is a link in your journal, not proof of the cause."
      medications:
        question: "How do I manage my medications?"
        answer: "Account › Medications. Add a medication, or pick it from the common ones, with its type: it decides how its days are counted. \"Edit\" changes the name, type or dose, or removes it (it is archived if already used). For a preventive treatment, record its periods: start, end and reason for stopping."
      statistics:
        question: "What do the statistics show?"
        answer: "The month's pain and treatment days, the treatment limits to watch, the effect of each acute treatment, the before and after of your preventive treatments, the link with your period if you track it, and what comes before your attacks according to your check-ins."
      report:
        question: "How do I prepare my appointment?"
        answer: "The \"Doctor report (PDF)\" link, in the journal or the statistics, produces the year: a summary page, an indicators page and your calendar sheets, like your neurologist's."
      install:
        question: "Can I install the app on my phone?"
        answer: "Yes: it then opens like an app, without the browser bar. On Android, Account › \"Install\", or Chrome's menu › \"Install app\"; a long press on the icon then offers \"I have a headache\" directly. On iPhone, in Safari: Share › \"Add to Home Screen\". Without network, the app still lets you note an attack: it joins the journal once the network is back."
      export:
        question: "How do I export my data?"
        answer: "Account › Data management › \"Export all data\" downloads a JSON file with your whole journal: episodes, medications and treatment periods, triggers, period days and daily check-ins."
      import:
        question: "Can I import a backup?"
        answer: "Yes, in the same place, with \"Import from file\". What is already there (same episode, same period day, same check-in) is skipped. If the file contains an error, nothing is imported."
      delete:
        question: "How do I delete my account?"
        answer: "Account › Data management › \"Delete my account\". Type the confirmation phrase and your password. Everything is erased permanently: export first if you want to keep a copy."
      storage:
        question: "Where is my data and who can see it?"
        answer: "On a server in the European Union, visible only to you from your account. It travels encrypted (HTTPS) and your password is hashed. No script, font or analytics tool from another site is loaded."
      sharing:
        question: "Do you share my data?"
        answer: "No. It is not sold, shared or used for advertising. Only the server's host stores it on our behalf."
      rights:
        question: "What are my rights?"
        answer: "Export your data, correct it in the app and delete your account, at any time and without writing to us. The details and the contact are in the privacy policy."
