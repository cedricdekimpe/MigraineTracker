  # Home page
  home:
    tagline: "Own your migraine story"
    description: "Log episodes, track medication effectiveness, and spot patterns with yearly and monthly calendars crafted for people living with migraines."
    geo_summary: "A free, privacy-focused web application for tracking migraines, monitoring medication effectiveness, and identifying patterns through visual calendars. Available in English and French. No account required to learn more."
