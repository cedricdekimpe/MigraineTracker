    feature_calendars_desc: "Capture every migraine on color-coded monthly and yearly views. Quickly see when clusters appear and which days stay clear."
    feature_medication_title: "Medication tracking"
    feature_medication_desc: "Record the treatments that work for you, customize medication options, and spot trends around dosage and relief time."
    feature_secure_title: "Secure and private"
    feature_secure_desc: "Your data stays protected behind authenticated access. Export yearly summaries as PDFs to share with providers when you choose."
    cta_title: "Ready to start tracking?"
    cta_description: "Build a complete picture of your migraine history and treatment plan. Whether you are preparing for a specialist visit or staying on top of daily wellbeing, Migraine Tracker gives you the structure you need."
    view_calendar: "View my calendar"
    manage_medications: "Manage medications"
